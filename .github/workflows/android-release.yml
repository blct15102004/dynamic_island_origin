name: Build & Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle wrapper executable
        run: |
          sed -i -e 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build APK (assembleDebug)
        run: |
          ./gradlew assembleDebug -x test -x testDebugUnitTest -x lint --no-daemon --info 2>&1 | tee build.log
        continue-on-error: true

      - name: Verify Build Output
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error title=Gradle Build Failed::APK not found."

            # Strip ANSI color codes for clean parsing
            sed 's/\x1B\[[0-9;]*m//g' build.log > build_clean.log

            # Print Kotlin compiler errors (various formats)
            echo "=== Kotlin/Compiler Errors ==="
            grep -E "^(e:|error:|\s*\^|.*\.kt:[0-9]+:[0-9]+: error)" build_clean.log | head -n 50 | while IFS= read -r line; do
              echo "::error::$line"
            done

            # Print What went wrong section
            echo "=== What Went Wrong ==="
            grep -A 20 "What went wrong:" build_clean.log | head -n 25 | while IFS= read -r line; do
              echo "::error::$line"
            done

            # Dump last 60 lines of build log
            echo "=== Last 60 lines ==="
            tail -n 60 build_clean.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

          APK_SIZE=$(stat -c%s "$APK_PATH")
          echo "Build successful! APK size: $APK_SIZE bytes"
          mkdir -p release_assets
          cp "$APK_PATH" release_assets/IsleBridge.apk
          cp "$APK_PATH" release_assets/IsleBridge-v1.1.0.apk

      - name: Upload Build Log (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IsleBridge-APK
          path: release_assets/IsleBridge.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1.0' }}
          name: "IsleBridge v1.1.0 (Origin Island Native)"
          files: |
            release_assets/IsleBridge.apk
            release_assets/IsleBridge-v1.1.0.apk
          body: |
            ### 📱 IsleBridge v1.1.0 — Origin Island Native Companion
            
            Bản cập nhật v1.1.0 chính thức cho điện thoại **vivo và iQOO (OriginOS 6 / OriginOS 7)**:
            - **100% Native Origin Island:** Tích hợp trực tiếp với Super Island gốc của hệ thống vivo/iQOO, loại bỏ hoàn toàn các lớp phủ giả (Overlay) và không cần quyền vẽ đè màn hình.
            - **Giao diện Material 3 đáp ứng (Responsive):** Khắc phục triệt để lỗi huy hiệu bị ép hẹp và vỡ chữ, lưới tính năng 2x2 cân đối, giao diện mượt mà.
            - **Nhận diện thiết bị thông minh:** Hỗ trợ chính xác thiết bị vivo/iQOO với thang đo độ tin cậy (*Confirmed / Estimated*).
            - **Trung tâm Shizuku hoàn thiện:** Hướng dẫn từng bước kích hoạt Gỡ lỗi không dây và ủy quyền an toàn không cần Root.
            - **Quản lý ứng dụng trực quan:** Hiển thị icon thật của ứng dụng, tìm kiếm tức thì, phân loại danh sách Origin Player và bảo vệ app tài chính.
            - **Thử nghiệm thông minh:** Thẻ test tự động ẩn sau 3 giây; nút Unmount dọn sạch thẻ thử nghiệm.
            
            #### 📥 Tải về và cài đặt:
            - Nhấn tải file **`IsleBridge.apk`** bên dưới và nhấn **Cài đặt**.
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
