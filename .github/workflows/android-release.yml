name: Android CI/CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # =========================================================================
  # Job 1: Build Debug APK on push to 'main'
  # =========================================================================
  build-debug:
    name: Build Debug APK
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Validate Debug APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Debug APK not found at $APK_PATH"
            exit 1
          fi
          echo "Debug APK build successful: $(stat -c%s "$APK_PATH") bytes"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IsleBridge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  # =========================================================================
  # Job 2: Auto-Publish APK to GitHub Releases on Tag (v*) - Zero Secrets Needed
  # =========================================================================
  build-release:
    name: Publish APK to GitHub Releases
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare Release Asset
        id: prepare_asset
        run: |
          TAG_NAME="${{ github.ref_name }}"
          RAW_APK="app/build/outputs/apk/release/app-release.apk"
          
          if [ ! -f "$RAW_APK" ]; then
            echo "Release APK not found, checking debug APK fallback..."
            RAW_APK="app/build/outputs/apk/debug/app-debug.apk"
          fi

          if [ ! -f "$RAW_APK" ]; then
            echo "::error::APK file not found!"
            exit 1
          fi

          DEST_DIR="${{ runner.temp }}/release_assets"
          mkdir -p "$DEST_DIR"
          RELEASE_APK="$DEST_DIR/IsleBridge-${TAG_NAME}.apk"
          cp "$RAW_APK" "$RELEASE_APK"

          echo "apk_path=$RELEASE_APK" >> "$GITHUB_OUTPUT"
          echo "APK ready at $RELEASE_APK ($(stat -c%s "$RELEASE_APK") bytes)"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "IsleBridge ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.prepare_asset.outputs.apk_path }}
          body: |
            ### 📱 IsleBridge ${{ github.ref_name }}
            
            Bản APK cài đặt trực tiếp cho điện thoại vivo / iQOO (OriginOS) và các máy Android khác.

            #### Hướng dẫn cài đặt:
            1. Tải file **`IsleBridge-${{ github.ref_name }}.apk`** bên dưới về điện thoại.
            2. Mở file và bấm **Cài đặt** (Bật "Cho phép cài đặt từ nguồn này" nếu máy hỏi).
            3. Mở ứng dụng và trải nghiệm Dynamic Island!
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
