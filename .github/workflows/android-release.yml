name: Build & Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle wrapper executable
        run: |
          sed -i -e 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build APK (assembleDebug)
        run: |
          ./gradlew assembleDebug -x test --no-daemon --stacktrace 2>&1 | tee build.log
        continue-on-error: true

      - name: Verify Build Output
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error title=Gradle Build Failed::APK not found. Dumping last 80 lines of build.log:"
            while IFS= read -r line; do
              echo "::error::$line"
            done < <(tail -n 80 build.log)
            exit 1
          fi

          APK_SIZE=$(stat -c%s "$APK_PATH")
          echo "Build successful! APK size: $APK_SIZE bytes"
          mkdir -p release_assets
          cp "$APK_PATH" release_assets/IsleBridge.apk
          cp "$APK_PATH" release_assets/IsleBridge-v1.0.0.apk

      - name: Upload Build Log (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IsleBridge-APK
          path: release_assets/IsleBridge.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "IsleBridge v1.0.0 (Bản cài đặt trực tiếp)"
          files: |
            release_assets/IsleBridge.apk
            release_assets/IsleBridge-v1.0.0.apk
          body: |
            ### 📱 IsleBridge v1.0.0 — Origin Island Companion
            
            Bản APK cài đặt trực tiếp cho điện thoại vivo, iQOO (OriginOS 6 / 7) và tất cả các thiết bị Android (Android 8.0+).
            
            #### 📥 Tải về:
            - Nhấn vào **`IsleBridge.apk`** bên dưới để tải trực tiếp về điện thoại.
            
            #### 🛠 Hướng dẫn cài đặt:
            1. Mở file vừa tải về từ thông báo trình duyệt hoặc ứng dụng **Tệp (Files)**.
            2. Nhấn **Cài đặt** (Bật *"Cho phép từ nguồn này"* nếu máy hỏi).
            3. Mở ứng dụng **IsleBridge** và làm theo hướng dẫn cấp quyền nhanh trên màn hình để bắt đầu dùng Dynamic Island!
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
